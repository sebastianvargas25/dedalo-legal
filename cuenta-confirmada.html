<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Correo confirmado — Dédalo</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f7f5f3;
    color: #1c1917;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #57534e; }
  a.boton {
    display: inline-block;
    margin-top: 8px;
    padding: 14px 24px;
    border-radius: 12px;
    background: #16365b;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div id="ok">
    <h1>Tu correo quedó confirmado</h1>
    <p>Ya podés volver a Dédalo e iniciar sesión con tu correo y contraseña.</p>
    <a class="boton" id="abrir" href="dedalo://recuperar-contrasena#type=signup">Abrir Dédalo</a>
  </div>
  <div id="error" hidden>
    <h1>Este enlace ya no sirve</h1>
    <p>Venció o ya se usó. Si tu cuenta no entra, abrí Dédalo y pedí otro correo.</p>
  </div>
</main>
<script>
  // Supabase deja los datos de la sesión después del #. Esta página no los
  // necesita: se sacan de la barra de direcciones y a la app solo se le avisa que
  // la cuenta quedó confirmada.
  var fragmento = new URLSearchParams(location.hash.slice(1));
  var conError = fragmento.get('error') || fragmento.get('error_code');
  var alCorreo = fragmento.get('type') === 'signup';
  history.replaceState(null, '', location.pathname);
  if (conError) {
    document.getElementById('ok').hidden = true;
    document.getElementById('error').hidden = false;
  } else if (alCorreo && /iPhone|iPad|Android/.test(navigator.userAgent)) {
    location.href = document.getElementById('abrir').href;
  }
</script>
</body>
</html>
